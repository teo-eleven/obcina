version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions current (the `# vX.Y.Z` comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
