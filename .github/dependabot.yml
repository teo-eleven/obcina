version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions current (the `# vX.Y.Z` comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Node's types must match the Node major in .nvmrc (24); bump both together, by hand.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    # One monthly PR for every minor/patch bump (ADR 0008); majors still come one by one.
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
