version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions current (the `# vX.Y.Z` comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node's types must match the Node major in .nvmrc (24); bump both together, by hand.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
